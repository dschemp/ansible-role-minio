---
minio_user: "minio"
minio_group: "minio"

minio_bin_dir: "/usr/local/bin"
minio_config_dir: "/opt/minio"

minio_download_url: "https://dl.min.io/server/minio/release/linux-amd64/minio"

# minio_domain: "minio.example.org"

## Credential generation only runs when /etc/default/minioadmin does not exist
## e.g. at initial installation.
## Requires the community.general collection for the random_string lookup.
## If you don't set any root credentials and disable generation the defaults by Minio will be used.
minio_root_generate_credentials: true
# minio_root_username: "minioadmin"
# minio_root_password: "minioadmin"

minio_address: ":9000"
minio_console_address: ":9001"

minio_browser_enabled: true
# minio_browser_redirect_enabled: true
# minio_browser_redirect_url: "https://example.org/minio/"
# minio_browser_login_animations_enabled: true
# minio_browser_session_duration: "12h"
# minio_browser_content_security_policy: "default-src 'self' 'unsafe-eval' 'unsafe-inline';"
# minio_browser_hsts_seconds: 31536000
# minio_browser_hsts_include_sub_domains_enabled: true
# minio_browser_hsts_preload_enabled: false
# minio_browser_referrer_policy: "strict-origin-when-cross-origin"

minio_anonymous_logging_enabled: true
minio_startup_information_enabled: true
minio_json_logging_enabled: false

minio_tls_enabled: false
# minio_tls_certificate_content: ""
# minio_tls_private_key_content: ""
# minio_tls_ca_content: ""

minio_volumes:
  - "/var/lib/minio"

# only to be used for opts which are not represented in any other way already
minio_opts: []
