---
- name: "Setup systemd service."
  ansible.builtin.template:
    src: "minio.service.j2"
    dest: "/etc/systemd/system/{{ minio_service_name }}.service"
    owner: "root"
    group: "root"
    mode: "0644"

- name: "Start and enable service."
  ansible.builtin.systemd_service:
    name: "{{ minio_service_name }}"
    daemon_reload: true
    state: "{{ minio_service_state }}"
    enabled: "{{ minio_service_enabled }}"

- name: "Flush handlers."
  ansible.builtin.meta: "flush_handlers"

- name: "Wait for service to be live (Healthcheck API)."
  when: "minio_service_state == 'started'"
  vars:
    _schema: "{{ 'https' if minio_tls_enabled else 'http' }}"
    _host: "localhost"
    _port: "{{ (minio_address | split(':'))[-1] }}"
    _ca_path: "{{ minio_config_dir }}/.minio/certs/CAs/myCA.crt"
    _use_ca: >
      {{ minio_tls_enabled and
      minio_service_healthcheck_validate_certs and
      (minio_tls_ca_content is defined) }}
  ansible.builtin.uri:
    url: "{{ _schema }}://{{ _host }}:{{ _port }}/minio/health/live"
    method: "GET"
    follow_redirects: "none"
    ca_path: "{{ _ca_path if _use_ca else omit }}"
    validate_certs: "{{ minio_service_healthcheck_validate_certs }}"
  register: "_result"
  until: "_result.status == 200"
  retries: 24 # 24 * 5 seconds = 2 min
  delay: 5 # Every 5 seconds
