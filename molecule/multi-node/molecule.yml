---
role_name_check: 1

dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: node01
    image: "geerlingguy/docker-${MOLECULE_DOCKER_IMAGE:-rockylinux8}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    published_ports:
      - 9000:9000
      - 9001:9001
    groups:
      - minio_cluster
    networks:
      - name: molecule
  - name: node02
    image: "geerlingguy/docker-${MOLECULE_DOCKER_IMAGE:-rockylinux8}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    published_ports:
      - 9010:9000
      - 9011:9001
    groups:
      - minio_cluster
    networks:
      - name: molecule

provisioner:
  name: ansible
